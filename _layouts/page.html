---
layout: default
---

<div class="page-head">
  <div class="wrap wrap--narrow">
    {% if page.eyebrow %}<span class="eyebrow">{{ page.eyebrow | escape }}</span>{% endif %}
    <h1>{{ page.title | escape }}</h1>
    {% if page.intro %}<p class="lede">{{ page.intro | escape }}</p>{% endif %}
  </div>
</div>
<div class="wrap wrap--narrow section">
  <div class="prose">{{ content }}</div>
</div>
