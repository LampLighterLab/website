name: Build and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check portrait formatting and file sizes
        run: |
          python3 -m venv "$RUNNER_TEMP/portrait-check"
          "$RUNNER_TEMP/portrait-check/bin/python" -m pip install -r requirements-dev.txt
          "$RUNNER_TEMP/portrait-check/bin/python" scripts/check_commit.py --check --all
          "$RUNNER_TEMP/portrait-check/bin/python" -m unittest discover -s tests

      - name: Set up Ruby and install locked dependencies
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Read GitHub Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_CONFIG: ${{ runner.temp }}/jekyll-pages.yml
        run: |
          ruby -ryaml -e 'File.write(ENV.fetch("PAGES_CONFIG"), {"url" => ENV.fetch("PAGES_ORIGIN"), "baseurl" => ENV.fetch("PAGES_BASE_PATH")}.to_yaml)'
          bundle exec jekyll build \
            --config "_config.yml,_config.production.yml,$PAGES_CONFIG" \
            --strict_front_matter

      - name: Verify compiled stylesheet
        run: |
          grep -qF '.site-header' _site/assets/css/main.css
          grep -qF '.text-small' _site/assets/css/main.css
          if grep -qE '@use[[:space:]]' _site/assets/css/main.css; then
            echo 'Stylesheet contains uncompiled Sass; build with the locked Jekyll dependencies.' >&2
            exit 1
          fi

      - name: Upload generated site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
