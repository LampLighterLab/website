<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/lamp.svg' | relative_url }}" alt="" width="44" height="44">
      <span class="brand__name">{{ site.title | escape }}</span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" hidden>
      <span>Menu</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <nav class="nav" id="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign active = false %}
        {% if page.url == item.url or page.section == item.section %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="is-active"{% if page.url == item.url %} aria-current="page"{% endif %}{% endif %}>{{ item.label | escape }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
