- slug: animal-movement
  title: Animal movement
  summary: >-
    How and why do animals learn to move the way they do? We study dynamics
    and locomotion in biology, with an emphasis on how morphology shapes learning and control.

- slug: robotics-and-learning
  title: Robotics and learning
  summary: >-
    When observations and intuition don't match our models and mathematics, we build new tools. Our work spans
    mathematical theory, computational methods, and hardware for robotics
    and machine learning.

- slug: agriculture
  title: Agriculture
  summary: >-
    Feeding a growing population sustainably is one of the grand challenges for our
    generation. We explore how tools from AI and robotics can help improve agriculture.
